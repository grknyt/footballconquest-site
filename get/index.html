<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Football Conquest</title>
<meta name="description" content="Download Football Conquest on Google Play or the App Store, or play free in your browser.">
<meta property="og:title" content="Football Conquest: pick a nation, conquer the world">
<meta property="og:description" content="Free football strategy game on Android, iPhone and the web.">
<meta property="og:image" content="https://footballconquest.com/assets/fc-logo.png">
<link rel="icon" href="/assets/favicon.svg">
<!-- Smart store link (Claude 2026-10-16): footballconquest.com/get sends Android phones to Google Play and
     iPhones/iPads to the App Store automatically; everything else (PC, Mac) sees both badges + "play in browser".
     ?to=play / ?to=ios / ?to=web force a destination (handy for testing); ?stay=1 shows the page without redirecting. -->
<script>
(function(){
  var PLAY='https://play.google.com/store/apps/details?id=com.ghiellini.footballconquest';
  var IOS='https://apps.apple.com/app/id6807651881';
  var WEB='/simulator.html';
  var q=new URLSearchParams(location.search), to=q.get('to'), ua=navigator.userAgent||'';
  var isAndroid=/Android/i.test(ua);
  // iPadOS 13+ reports itself as a Mac; a touch screen gives it away
  var isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var dest=to==='play'?PLAY:to==='ios'?IOS:to==='web'?WEB:(!q.get('stay')&&(isAndroid?PLAY:isIOS?IOS:null));
  if(dest){location.replace(dest);}
  window.FC_STORE={play:PLAY,ios:IOS,web:WEB};
})();
</script>
<style>
:root{--bg:#040b12;--card:#0d2231;--txt:#eaf4f8;--mut:#9fb6c2;--green:#6de8b0;--edge:#2b4c61}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 110%,#0f3a2a 0%,#07161f 45%,#040b12 75%)}
.card{width:min(420px,100%);text-align:center;padding:28px 22px;border-radius:20px;background:linear-gradient(180deg,#0f2738,#081723);box-shadow:inset 0 0 0 1.5px var(--edge),0 18px 40px #0008}
img.logo{width:84px;height:84px}h1{margin:12px 0 4px;font-size:26px;font-style:italic;letter-spacing:-.5px}h1 span{color:var(--green)}
p{color:var(--mut);margin:0 0 20px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;padding:14px 16px;border-radius:14px;text-decoration:none;font-weight:800;color:#e6f2f8;background:#13283e;box-shadow:inset 0 0 0 1.5px #3b6680}
.btn.web{background:linear-gradient(180deg,#9af7cd,#6de8b0 45%,#23b37a);color:#05281a;box-shadow:none}
.btn small{display:block;font-weight:600;font-size:11px;opacity:.8}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/assets/fc-logo.png" alt="Football Conquest">
  <h1>FOOTBALL <span>CONQUEST</span></h1>
  <p>Pick a nation. Build your squad. Conquer the world.</p>
  <a class="btn" id="b-play" href="https://play.google.com/store/apps/details?id=com.ghiellini.footballconquest">▶ <span>Get it on Google Play<small>Android</small></span></a>
  <a class="btn" id="b-ios" href="https://apps.apple.com/app/id6807651881">🍎 <span>Download on the App Store<small>iPhone &amp; iPad</small></span></a>
  <a class="btn web" href="/simulator.html">Play free in your browser</a>
</main>
</body>
</html>
